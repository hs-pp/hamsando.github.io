{% if site.data.settings.hero.enable == true %}
<!-- begin hero -->
<section class="hero">
    <div class="hero__header">
        <div class="hero__avatar">
            <img class="lazy" data-src="{{ site.data.settings.hero.hero__icon }}">
        </div>
        <h1 class="hero__title">{{ site.data.settings.hero.hero__title }}</h1>

<!--        {% if site.data.settings.social %}-->
<!--        <div class="social">-->
<!--            <ul class="social__list list-reset">-->
<!--                {% for social in site.data.settings.social %}-->
<!--                <li class="social__item">-->
<!--                    <a class="social__link" href="{{social.link}}" target="_blank" rel="noopener"-->
<!--                       aria-label="Social link"><i class="ion {{social.icon}}"></i></a>-->
<!--                </li>-->
<!--                {% endfor %}-->
<!--            </ul>-->
<!--        </div>-->
<!--        {% endif %}-->
        
        <p class="hero__description">{{ site.data.settings.hero.hero__description }}</p>

        {% if site.data.settings.mailchimp.enable == true %}
        <div class="hero__subscribe">
            <form class="subscribe-form validate"
                  action="{% if site.data.settings.mailchimp.mailchimp__identifier %}//{{site.data.settings.mailchimp.mailchimp__identifier}}{% else %}#{% endif %}"
                  method="POST"
                  id="membedded-subscribe-form" name="membedded-subscribe-form" target="_blank" novalidate>
                <label class="screen-reader-text" for="mce-EMAIL">Email address</label>
                <input class="subscribe-email required email" id="mce-EMAIL" type="text" name="EMAIL"
                       placeholder="{% if site.data.settings.mailchimp.mailchimp__input__text %}{{ site.data.settings.mailchimp.mailchimp__input__text }}{% else %}Email address{% endif %}">
                <button class="button button--primary subscribe-button" id="membedded-subscribe" type="submit"
                        name="subscribe">{{
                    site.data.settings.mailchimp.mailchimp__button__text }}
                </button>
            </form>
        </div>
        {% endif %}
    </div>
</section>
<!-- end hero -->
{% endif %}
